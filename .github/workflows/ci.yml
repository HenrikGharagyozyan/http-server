name: C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [{cxx: g++, c: gcc}, {cxx: clang++, c: clang}]
        preset: [dev, release]

    steps:
    - uses: actions/checkout@v4

    - name: Set up CMake
      uses: jwlawson/actions-setup-cmake@v1.13
      
    - name: Configure CMake
      env:
        CXX: ${{ matrix.compiler.cxx }}
        CC: ${{ matrix.compiler.c }}
      run: cmake --preset ${{ matrix.preset }}

    - name: Build
      run: cmake --build ${{ matrix.preset == 'dev' && 'build' || 'build_release' }} -j4

    - name: Run Tests
      run: ctest --test-dir ${{ matrix.preset == 'dev' && 'build' || 'build_release' }} --output-on-failure